# No environment-specific value and no secret is committed here. Every such
# value is read from the environment; see .env.example for the full list.
#
# Placeholders without a default are required: the application fails to start
# rather than silently falling back to something wrong.
spring:
  application:
    name: papaprecoapi
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: none
    generate-ddl: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    protocol: smtps
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtps
        smtps:
          auth: true
          starttls:
            enable: true
          timeout: '8000'
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /papaprecoapi

# Spring resource locations, so both 'file:' and 'classpath:' work. The keys
# themselves live outside the source tree and outside the image.
jwt:
  rsa:
    pub: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt.rsa.pub}
    priv: ${JWT_PRIVATE_KEY_LOCATION:file:./secrets/jwt.rsa.priv}

firebase:
  credentials:
    location: ${FIREBASE_CREDENTIALS_LOCATION:file:./secrets/firebase-service-account.json}

# Defaults are production-safe. The previous TRACE levels logged bound SQL
# parameters and authentication internals, which puts password hashes and
# verification codes in the log; raise these per-run via LOG_LEVEL_* instead.
logging:
  level:
    org:
      springframework:
        data:
          jpa: ${LOG_LEVEL_JPA:INFO}
        security: ${LOG_LEVEL_SECURITY:INFO}
      hibernate:
        SQL: ${LOG_LEVEL_SQL:INFO}
        type:
          descriptor:
            sql:
              BasicBinder: ${LOG_LEVEL_SQL_PARAMS:INFO}
